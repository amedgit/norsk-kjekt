<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Norsk Kjekt · Español</title>
  <link rel="canonical" href="https://norskkjekt.com/?lang=es">
  <script>
    try {
      var st = localStorage.getItem('norsk-kjekt-theme');
      var mode = (st === 'dark' || st === 'sepia' || st === 'light') ? st : 'sepia';
      if (mode === 'dark' || mode === 'sepia') document.documentElement.setAttribute('data-theme', mode);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'sepia');
    }
    try {
      var params = new URLSearchParams(location.search);
      params.set('lang', 'es');
      location.replace('/?' + params.toString() + location.hash);
    } catch (e) {
      location.replace('/?lang=es' + location.hash);
    }
  </script>
  <style>
    html, body { height: 100%; }
    body {
      margin: 0; display: grid; place-items: center;
      background: #efe4cf; color: #33261a;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .box {
      max-width: 28rem; margin: 1rem; padding: 1.5rem 1.7rem;
      background: #fbf4e4; border: 1px solid #dfcca9; border-radius: 18px;
      box-shadow: 0 10px 26px -14px rgba(70, 50, 30, .3);
    }
    h1 { margin: 0 0 .5rem; font-size: 1.25rem; }
    p { margin: .35rem 0; line-height: 1.6; color: #57452f; font-size: .95rem; }
    a { color: #a3342b; font-weight: 700; }
    html[data-theme="dark"] body { background: #0d1420; color: #e9eff9; }
    html[data-theme="dark"] .box { background: #151f2d; border-color: #273343; }
    html[data-theme="dark"] p { color: #c3cedd; }
    html[data-theme="dark"] a { color: #ef5a72; }
  </style>
</head>
<body>
  <main class="box">
    <h1>Norsk Kjekt · Español</h1>
    <p>Abriendo la versión en español…</p>
    <p><a href="/?lang=es">Continuar en español</a></p>
  </main>
</body>
</html>
